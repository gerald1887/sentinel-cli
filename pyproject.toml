[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cli"
version = "0.1.0"
description = "CLI-first toolkit for deterministic, CI-oriented checks on structured LLM workflows (contracts, tests, guardrails, drift, monitoring, audit)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sentinel CLI contributors"}]
keywords = ["llm", "cli", "testing", "ci", "json-schema", "guardrails", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.22",
    "openai>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
exclude = [
    "tests*",
    "docs*",
    "integration*",
    "examples*",
    "*.egg-info*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_regression_suite_runner.py" = ["E402"]
"tests/unit/test_regression_update_runner.py" = ["E402"]
